[project]
name = "kataster-mcp"
version = "0.1.0"
description = "MCP server for the Slovak land registry (kataster nehnuteľností SR): parcels, LV, owners, soil, LPIS, floods, nature protection, maps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Branislav Klocok", email = "branislav.klocok@orava.sk" }]
keywords = ["kataster", "slovakia", "cadastre", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Slovak",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27.0",
    "shapely>=2.2.0",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/braklo/kataster-mcp"
Issues = "https://github.com/braklo/kataster-mcp/issues"

[project.scripts]
kataster-mcp = "kataster_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allowlist for the source distribution.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/kataster_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real public endpoints (run by hand, human pace)"]
addopts = "-m 'not live'"
